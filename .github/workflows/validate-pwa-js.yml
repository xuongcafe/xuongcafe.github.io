name: Validate PWA JavaScript

on:
  push:
    paths:
      - 'app.js'
      - '.github/workflows/validate-pwa-js.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check PWA app.js
        run: node --check app.js
