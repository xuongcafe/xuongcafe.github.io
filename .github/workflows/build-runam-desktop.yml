name: Build RUNAM Desktop Setup

on:
  workflow_dispatch:
  push:
    paths:
      - 'RUNAM-Desktop-2.6.6-Mobile-Features-Update-Source-CI.zip'
      - '.github/workflows/build-runam-desktop.yml'

permissions:
  contents: read

env:
  SOURCE_ARCHIVE: RUNAM-Desktop-2.6.6-Mobile-Features-Update-Source-CI.zip

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        shell: pwsh
        run: |
          if (!(Test-Path $env:SOURCE_ARCHIVE)) {
            throw "Missing $env:SOURCE_ARCHIVE in repository root."
          }

      - name: Extract source and locate package.json
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'runam-source'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $env:SOURCE_ARCHIVE -DestinationPath $destination -Force
          $package = Get-ChildItem -LiteralPath $destination -Filter 'package.json' -File -Recurse | Select-Object -First 1
          if ($null -eq $package) { throw 'package.json not found anywhere in source ZIP.' }
          $root = $package.Directory.FullName
          "RUNAM_SOURCE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUNAM_DIST_DIR=$root\dist" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Source root: $root"
          Get-Content (Join-Path $root 'package.json') -TotalCount 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Install dependencies and rebuild native modules
        shell: pwsh
        run: |
          Set-Location $env:RUNAM_SOURCE_DIR
          npm install --no-audit --no-fund
          npx electron-builder install-app-deps

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          Set-Location $env:RUNAM_SOURCE_DIR
          npm run dist:win

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: RUNAM-Setup-2.6.6-Win7-x64
          path: ${{ env.RUNAM_DIST_DIR }}/*.exe
          if-no-files-found: error
          retention-days: 30
