<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>RUNAM - Xem phiếu giao hàng</title>
<style>
:root{--brown:#3c2415;--beige:#cbb397;--panel:#ececee;--line:#d4d4d8;--ink:#171717}
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:var(--ink);font-family:Arial,"Be Vietnam Pro",sans-serif}
.page{width:min(1120px,calc(100% - 24px));margin:22px auto;background:#fff;padding:34px 44px 42px;box-shadow:0 2px 16px #00000012;min-height:700px}
h1{text-align:center;color:var(--brown);font-size:30px;letter-spacing:1px;margin:4px 0 18px;font-weight:800}
.rule{height:2px;background:#76675e;margin-bottom:18px}
.top{display:grid;grid-template-columns:36% 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--panel);border-radius:13px;padding:16px}
.panel h2{text-align:center;font-size:17px;letter-spacing:1.2px;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid #86776e;color:#222}
.info-row{display:flex;justify-content:space-between;gap:14px;margin:9px 0;font-size:16px;font-weight:600}.info-row span:last-child{text-align:right;font-weight:700}
.customer-body{font-size:16px;line-height:1.5;font-weight:600;min-height:110px;white-space:pre-line}
.customer-flex{display:flex;justify-content:space-between;gap:16px}.customer-text{flex:1;min-width:0}.qr-placeholder{width:118px;height:118px;background:#fff;border:1px solid #ddd;display:grid;place-items:center;color:#888;font-size:12px;text-align:center;padding:8px;flex:none}
table{width:100%;border-collapse:collapse;table-layout:auto;font-size:15px}th{background:#c9b397;color:#23180f;text-align:left;font-weight:700}th,td{border:1px solid #c9c9ce;padding:9px 8px;vertical-align:middle}td{font-weight:600}.center{text-align:center}.right{text-align:right;white-space:nowrap}
.bottom{border-top:3px solid #5b463a;margin-top:16px;padding-top:10px;display:flex;justify-content:flex-end}.totals{text-align:right;font-size:17px;font-weight:700;line-height:1.5}.people{display:flex;justify-content:space-between;gap:20px;margin-top:30px;font-size:16px;font-weight:700}.person{min-width:40%}.person:last-child{text-align:right}
.status{max-width:800px;margin:40px auto;padding:20px;background:#fff;border:1px solid #ddd;border-radius:12px;color:#333;line-height:1.5}.muted{color:#777;font-weight:400}
@media(max-width:700px){.page{width:100%;margin:0;padding:18px 12px;min-height:100vh}.top{grid-template-columns:1fr}.panel{padding:13px}h1{font-size:23px}.info-row{font-size:14px}.customer-body{font-size:14px}table{font-size:12px}th,td{padding:6px 4px}.totals{font-size:14px}.people{font-size:14px}}
@media print{body{background:#fff}.page{width:100%;margin:0;padding:8mm;box-shadow:none;min-height:0}.status{display:none}@page{size:A4;margin:5mm}}
</style></head>
<body>
<div id="app"><div class="status">Đang đọc dữ liệu phiếu...</div></div>
<script>
(()=>{
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtDate=v=>{if(!v)return '-';const s=String(v);let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[3]}/${m[2]}/${m[1]}`;m=s.match(/^(\d{2})(\d{2})(\d{4})$/);if(m)return `${m[1]}/${m[2]}/${m[3]}`;return s};
 const num=v=>{const n=Number(String(v??0).replace(',','.'));return Number.isFinite(n)?n:0};
 const fmt=v=>Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:3});
 const params=new URLSearchParams(location.search);
 const decode64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
 let rows=[],ticket={};
 // Payload day du moi: ?d=... (duoc tao tu ma QR RUNAM1)
 if(params.has('d')){
   try{
     const o=JSON.parse(decode64(params.get('d')||''));
     if(Array.isArray(o)&&o[0]===1){
       const kh=o[5]||[];
       ticket={soPhieu:o[1]||'',soPhieuXuat:o[2]||'',soPO:o[3]||'',ngayGiao:o[4]||'',customer:{maKhach:kh[0]||'',tenDaiLy:kh[1]||'',diaChi:kh[2]||'',nguoiNhan:kh[3]||'',sdt:kh[4]||'',loaiXe:kh[5]||''},products:(o[7]||[]).map(r=>({maKho:r[0]||'',maFast:r[1]||'',tenSP:r[2]||'',quyCach:r[3]||'',ngaySX:r[4]||'',soGoi:r[5]||0,donVi:r[6]||'',soKg:r[7]||0})),totalKg:o[8]||0,nguoiGiao:o[9]||'',nguoiNhanHang:o[10]||kh[3]||''};
       rows=ticket.products;
     }
   }catch(e){}
 }
 // Tiep tuc ho tro cac QR cu dang ?c=... hoac ?t=...
 if(!rows.length&&params.has('c')){
   const raw=params.get('c')||'';
   rows=raw.split(',').filter(Boolean).map(x=>{const a=x.split(':');return {maFast:a[0]||'',soGoi:num(a[1]),ngaySX:a[2]||'',tenSP:'',quyCach:'',donVi:'gói'};});
 }else if(!rows.length&&params.has('t')){
   const raw=params.get('t')||'';
   rows=raw.split(',').filter(Boolean).map(x=>{const a=x.split('::');return {maFast:a[1]||'',tenSP:a[2]||'',quyCach:a[3]||'',ngaySX:a[4]||'',soGoi:num(a[5]),donVi:a[6]||'gói'};});
 }else if(!rows.length&&params.has('data')){
   try{ticket=JSON.parse(decode64(params.get('data')));rows=Array.isArray(ticket.products)?ticket.products:[];}catch(e){}
 }
 // Optional metadata supported for a future full-data QR payload.
 const customer=ticket.customer||{};
 const get=(key,fallback='')=>ticket[key]??params.get(key)??fallback;
 const person=(key)=>ticket[key]??params.get(key)??'';
 if(!rows.length){$('#app').innerHTML='<div class="status"><b>Không đọc được dữ liệu sản phẩm.</b><br>Vui lòng quét lại mã QR trên phiếu RUNAM.</div>';return;}
 let totalQty=0,totalKg=0;
 const body=rows.map((p,i)=>{
   const qty=num(p.soGoi??p.qty);const qc=String(p.quyCach||'');const mass=qc.match(/([0-9]+(?:[.,][0-9]+)?)\s*(kg|g)\b/i);let kg=num(p.soKg);
   if(!kg&&mass){const v=num(mass[1]);kg=qty*(mass[2].toLowerCase()==='g'?v/1000:v);}
   totalQty+=qty;totalKg+=kg;
   return `<tr><td class="center">${i+1}</td><td>${esc(p.maFast||'')}</td><td>${esc(p.tenSP||'')}</td><td>${esc(qc||'-')}</td><td>${esc(fmtDate(p.ngaySX))}</td><td class="right">${fmt(qty)} ${esc(p.donVi||'gói')}</td><td class="right">${fmt(kg)} kg</td></tr>`;
 }).join('');
 const soPhieu=get('soPhieu','-'),soPhieuXuat=get('soPhieuXuat','-'),soPO=get('soPO','-'),ngay=get('ngayGiao','-');
 const name=customer.tenDaiLy||get('tenDaiLy','');const address=customer.diaChi||get('diaChi','');const recipient=customer.nguoiNhan||get('nguoiNhan','');const phone=customer.sdt||get('sdt','');
 const nguoiGiao=person('nguoiGiao');const nguoiNhan=person('nguoiNhanHang')||recipient;
 $('#app').innerHTML=`<main class="page"><h1>PHIẾU GIAO HÀNG</h1><div class="rule"></div><section class="top"><div class="panel"><h2>THÔNG TIN PHIẾU</h2><div class="info-row"><span>Số phiếu</span><span>${esc(soPhieu)}</span></div><div class="info-row"><span>Số phiếu xuất</span><span>${esc(soPhieuXuat||'-')}</span></div><div class="info-row"><span>Số PO</span><span>${esc(soPO||'-')}</span></div><div class="info-row"><span>Ngày giao</span><span>${esc(fmtDate(ngay))}</span></div></div><div class="panel"><h2>THÔNG TIN KHÁCH HÀNG</h2><div class="customer-flex"><div class="customer-text customer-body">${name?`• ${esc(name)}<br>`:''}${address?`${esc(address)}<br>`:''}${recipient?`• ${esc(recipient)}<br>`:''}${phone?`${esc(phone)}`:''}</div></div></div></section><table><thead><tr><th style="width:5%">STT</th><th style="width:13%">Mã Fast</th><th>Sản phẩm</th><th style="width:11%">Quy cách</th><th style="width:13%">NSX</th><th style="width:12%">Số lượng</th><th style="width:10%">Kg</th></tr></thead><tbody>${body}</tbody></table><section class="bottom"><div class="totals">Tổng số lượng: ${fmt(totalQty)}<br>Tổng khối lượng: ${fmt(totalKg)} kg</div></section><section class="people"><div class="person">Người giao hàng: ${esc(nguoiGiao||'-')}</div><div class="person">Người nhận hàng: ${esc(nguoiNhan||'-')}</div></section></main>`;
})();
</script></body></html>
